# ESP32-C3 SuperMini garage door controller (ESPHome -> Home Assistant)
#
# Wiring (see README.md for details):
#   GPIO4  -> relay module IN   (relay COM/NO go to the opener's wall-button terminals)
#   GPIO3  -> reed switch       (other reed wire to GND; closed = door closed)
#   GPIO8  -> onboard blue LED  (status, built in)

substitutions:
  name: garage-door
  friendly_name: Garage Door
  relay_pin: GPIO4
  reed_pin: GPIO3
  press_time: 500ms

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}   # reuses the api encryption key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Many C3 SuperMini boards have a poorly matched antenna and drop off
  # Wi-Fi at full power. Lowering TX power is the well-known fix.
  output_power: 8.5dB
  ap:
    ssid: "Garage-Door Fallback"
    password: !secret fallback_ap_password

captive_portal:

# Backup control page at http://garage-door.local (works without Home Assistant)
web_server:
  port: 80
  ota: false   # firmware updates only via encrypted ESPHome OTA
  auth:
    type: digest
    username: admin
    password: !secret web_password

status_led:
  pin:
    number: GPIO8
    inverted: true
    ignore_strapping_warning: true   # it's the onboard LED, safe to use

# --- Door position (reed switch) -------------------------------------------
binary_sensor:
  - platform: gpio
    id: door_closed
    name: "Closed"
    device_class: garage_door
    pin:
      number: ${reed_pin}
      mode:
        input: true
        pullup: true
      inverted: true   # magnet present -> switch closes to GND -> "closed"
    filters:
      - delayed_on_off: 250ms   # debounce

# --- Relay that "presses" the wall button ----------------------------------
switch:
  - platform: gpio
    id: relay
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF   # never boot with the button held down
    internal: true

script:
  - id: press_button
    mode: single   # ignore extra presses while one is in progress
    then:
      - switch.turn_on: relay
      - delay: ${press_time}
      - switch.turn_off: relay

# Raw "press the button" control, same as the wall button
button:
  - platform: template
    name: "Button"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: press_button

# The main garage door entity in Home Assistant.
# Open/Close only press the button when it would move the door the right way.
cover:
  - platform: template
    id: garage_door
    name: None
    device_class: garage
    lambda: |-
      return id(door_closed).state ? COVER_CLOSED : COVER_OPEN;
    open_action:
      - if:
          condition:
            binary_sensor.is_on: door_closed
          then:
            - script.execute: press_button
    close_action:
      - if:
          condition:
            binary_sensor.is_off: door_closed
          then:
            - script.execute: press_button

# --- Diagnostics -------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
